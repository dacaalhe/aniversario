
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tu regalo ❤️</title>

  <style>
    /* =========================================
       CONFIGURACIÓN GENERAL
    ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff0f5;
      color: #5a2638;
    }

    /* =========================================
       INICIO
    ========================================= */

    .inicio {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      padding: 20px;
      overflow: hidden;

      background: linear-gradient(
        135deg,
        #ffb6c9,
        #ff6f9f,
        #ff9ebc
      );
    }

    .contenido {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      padding: 50px 35px;
      border-radius: 30px;
      border: 2px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      max-width: 600px;
      animation: aparecer 1.5s ease;
    }

    .corazon-principal {
      font-size: 65px;
      animation: latir 1.5s infinite;
      margin-bottom: 15px;
    }

    h1 {
      color: white;
      font-size: 3rem;
      margin-bottom: 15px;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.15);
    }

    .nombres {
      color: white;
      font-size: 1.5rem;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .frase {
      color: white;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .boton-entrar {
      display: inline-block;
      padding: 16px 35px;
      background: white;
      color: #e84375;
      text-decoration: none;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: bold;
      transition: 0.3s;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
    }

    .boton-entrar:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    /* =========================================
       CORAZONES FLOTANTES
    ========================================= */

    .corazon {
      position: absolute;
      bottom: -50px;
      color: white;
      opacity: 0.7;
      animation: flotar linear infinite;
      z-index: 1;
    }

    .corazon:nth-child(1) {
      left: 5%;
      font-size: 30px;
      animation-duration: 8s;
    }

    .corazon:nth-child(2) {
      left: 15%;
      font-size: 50px;
      animation-duration: 12s;
      animation-delay: 2s;
    }

    .corazon:nth-child(3) {
      left: 30%;
      font-size: 25px;
      animation-duration: 10s;
      animation-delay: 1s;
    }

    .corazon:nth-child(4) {
      left: 45%;
      font-size: 45px;
      animation-duration: 14s;
      animation-delay: 4s;
    }

    .corazon:nth-child(5) {
      left: 60%;
      font-size: 35px;
      animation-duration: 9s;
      animation-delay: 2s;
    }

    .corazon:nth-child(6) {
      left: 75%;
      font-size: 55px;
      animation-duration: 13s;
      animation-delay: 3s;
    }

    .corazon:nth-child(7) {
      left: 90%;
      font-size: 30px;
      animation-duration: 11s;
      animation-delay: 1s;
    }

    /* =========================================
       SECCIÓN NOSOTROS
    ========================================= */

    #nosotros {
      min-height: 100vh;
      padding: 90px 20px;
      text-align: center;

      background: linear-gradient(
        180deg,
        #fff0f5,
        #ffe0ea
      );
    }

    .titulo-seccion {
      color: #d93668;
      font-size: 2.7rem;
      margin-bottom: 15px;
    }

    .subtitulo {
      max-width: 650px;
      margin: 0 auto 45px;
      line-height: 1.7;
      font-size: 1.1rem;
      color: #704052;
    }

    /* =========================================
       MENÚ DE NOSOTROS
    ========================================= */

    .menu-nosotros {
      max-width: 700px;
      margin: auto;
    }

    .opcion {
      background: white;
      margin: 15px 0;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(180, 60, 100, 0.12);
      border: 1px solid #ffd1df;
    }

    .boton-opcion {
      width: 100%;
      border: none;
      background: white;
      color: #d93668;
      padding: 22px;
      font-size: 1.15rem;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
      transition: 0.3s;
    }

    .boton-opcion:hover {
      background: #fff3f7;
    }

    .contenido-opcion {
      display: none;
      padding: 0 25px 25px;
      text-align: left;
      line-height: 1.7;
      color: #704052;
    }

    .contenido-opcion.activo {
      display: block;
      animation: aparecer 0.4s ease;
    }

    /* =========================================
       ANIMACIONES
    ========================================= */

    @keyframes flotar {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 0.7;
      }

      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes latir {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================================
       MÓVILES
    ========================================= */

    @media (max-width: 600px) {

      .contenido {
        padding: 40px 25px;
      }

      h1 {
        font-size: 2.2rem;
      }

      .nombres {
        font-size: 1.2rem;
      }

      .frase {
        font-size: 1rem;
      }

      .titulo-seccion {
        font-size: 2.2rem;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================
       CORAZONES
  ========================================= -->

  <div class="corazon">❤️</div>
  <div class="corazon">💕</div>
  <div class="corazon">❤️</div>
  <div class="corazon">💗</div>
  <div class="corazon">💕</div>
  <div class="corazon">❤️</div>
  <div class="corazon">💖</div>


  <!-- =========================================
       🏠 INICIO
  ========================================= -->

  <section class="inicio">

    <div class="contenido">

      <div class="corazon-principal">❤️</div>

      <!-- ✏️ CAMBIA AQUÍ EL TÍTULO -->
      <h1>Nuestro primer año</h1>

      <!-- ✏️ CAMBIA AQUÍ VUESTROS NOMBRES -->
      <p class="nombres">David ❤️ Adriana</p>

      <!-- ✏️ CAMBIA AQUÍ LA FRASE -->
      <p class="frase">
        Hay historias que merecen ser contadas...
        y la nuestra es una de mis favoritas.
        ❤️
      </p>

      <a href="historia.html" class="boton-entrar">
    Entrar en nuestra historia ❤️
</a>

  </script>

</body>
</html>
