os. Cuando vimos la cabalgata de reyes juntos y nos dimos los regalos. Un día de Enero que quedamos e hicimos una misión secundaria de cuidar a un gato que yo estaba intentando que bajase del árbol y te decía que fueramos a por comida. Cuando me fusite a ver de verdad el primer partido que juege en Avilés y me sacaste fotos y criticabas con mis padres a Camilo. Cuando fue mi cumpleaños que yo te decía que era un día más para mí que no me gustaba celebrar mi cumpleaños e hiciste que fuese el mejor, al día siguiente fuimos a celebrarlo con mis padres.Cuando celebramos nuestro primer San Valentín juntos que tus regalos fueron increibles en comparación con los mios. Cuando fuimos a la Champions Burger que nos hacía mucha ilusión y las hamburgesas estaban buenísimas (hay que repetir). Cuando salimos por primera vez de fiesta juntos en la Flor de Lada que nos recogieron tus padres (el segundo día es para repetirlo pero sin pasarse). Cuando fui a las fiestas del colegio a  ver a estos jugar la final y me quede contigo lo que quedaba de día. Cuando fuimos juntos a celebrar tu cumpleaños a la Nietos y te regale tu preciada Cecotec jajajajaj. Cuando fui con vosotras al Parque Nuevo a ayudaros a preparar el baile de E.F que no hice nada pero por lo menos nos reimos. Cuando fuimos con tu padre a la hogera de San Juan y tambíen nos hicimos unas fotos preciosas. Cuando fuimos juntos a las piscinas por primera vez a Tudela Veguín hay con todos los gitanos. Cuando salimos juntos en San Pedro a los carruseles y de noche y un paisano me tiro el cubata y la mujer se nego a pagarmelo y dijo que no lo hubiera llevado en la mano (hay un día por hay para olvidar). Cuando fuimos juntos a ver la final del Mundial que España gano que fue todo una euforia. Cuando fuimos juntos por primera vez a la playa a Gijón que las gaviotas fueron unas hijas de puta. Cuando fuimos a ver el eclipse con tus padres y al final era solo nubes. Y el otro día cuando vinimos a mi casa a hacernos las mascarillas q         counterStyle.textContent = `.contador-aniversario{max-width:760px;margin:-10px auto 42px;padding:28px 24px;text-align:center;background:rgba(255,255,255,.88);border:1px solid #ffd1df;border-radius:25px;box-shadow:0 8px 25px rgba(180,60,100,.12)}.contador-aniversario h2{margin:0 0 10px;color:#d93668;font-size:1.45rem}.contador-aniversario p{margin:0 0 22px;color:#704052;line-height:1.5}.contador-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.contador-item{padding:16px 8px;border-radius:16px;color:white;background:linear-gradient(135deg,#ffb6c9,#ff6f9f);box-shadow:0 5px 15px rgba(217,54,104,.18)}.contador-numero{display:block;font-size:1.7rem;font-weight:bold}.contador-etiqueta{display:block;margin-top:4px;font-size:.72rem;font-weight:bold;letter-spacing:.05em;text-transform:uppercase}@media(max-width:560px){.contador-aniversario{margin:0 15px 32px;padding:23px 14px}.contador-grid{grid-template-columns:repeat(3,1fr);gap:7px}.contador-item{padding:13px 4px}.contador-numero{font-size:1.35rem}.contador-etiqueta{font-size:.63rem}}`;
        historyPage.head.append(counterStyle);
        const counter = historyPage.createElement('section');
        counter.className = 'contador-aniversario';
        counter.innerHTML = '<h2>❤️ Nuestro tiempo juntos ❤️</h2><p>Desde el 11 de septiembre de 2025 a las 15:34</p><div class="contador-grid"><div class="contador-item"><span class="contador-numero" id="contador-anos">0</span><span class="contador-etiqueta">años</span></div><div class="contador-item"><span class="contador-numero" id="contador-meses">0</span><span class="contador-etiqueta">meses</span></div><div class="contador-item"><span class="contador-numero" id="contador-dias">0</span><span class="contador-etiqueta">días</span></div><div class="contador-item"><span class="contador-numero" id="contador-horas">0</span><span class="contador-etiqueta">horas</span></div><div class="contador-item"><span class="contador-numero" id="contador-minutos">0</span><span class="contador-etiqueta">minutos</span></div><div class="contador-item"><span class="contador-numero" id="contador-segundos">0</span><span class="contador-etiqueta">segundos</span></div></div>';
        historyPage.querySelector('header').insertAdjacentElement('afterend', counter);
        const examCard = historyPage.createElement('a');
        examCard.href = '#'; examCard.dataset.target = 'examen'; examCard.className = 'tarjeta';
        examCard.innerHTML = '<div class="icono">📝</div><h2>Exámenes</h2><p>30 preguntas tipo test de Lengua para practicar y comprobar cuánto sabes.</p>';
        historyPage.querySelector('.menu').append(examCard);
        const counterScript = historyPage.createElement('script');
        counterScript.textContent = 'const inicioContador=new Date(2025,8,11,15,34,0);function actualizarContador(){const ahora=new Date();let cursor=new Date(inicioContador);let anos=ahora.getFullYear()-cursor.getFullYear();cursor.setFullYear(cursor.getFullYear()+anos);if(cursor>ahora){anos--;cursor.setFullYear(cursor.getFullYear()-1)}let meses=0;while(meses<11){const proximo=new Date(cursor.getFullYear(),cursor.getMonth()+1,inicioContador.getDate(),inicioContador.getHours(),inicioContador.getMinutes(),inicioContador.getSeconds());if(proximo>ahora)break;cursor=proximo;meses++}let resto=ahora-cursor;const dia=86400000,hora=3600000,minuto=60000;const valores={anos:anos,meses:meses,dias:Math.floor(resto/dia),horas:Math.floor(resto%dia/hora),minutos:Math.floor(resto%hora/minuto),segundos:Math.floor(resto%minuto/1000)};Object.entries(valores).forEach(function([nombre,valor]){document.getElementById("contador-"+nombre).textContent=String(valor).padStart(2,"0")})}actualizarContador();setInterval(actualizarContador,1000);';
        historyPage.body.append(counterScript);
        html = '<!doctype html>' + historyPage.documentElement.outerHTML;
      }      if (name === 'carta') {
        const letterPage = new DOMParser().parseFromString(html, 'text/html');
        letterPage.querySelector('.carta h2').textContent = LETTER.heading;
        const letterMessage = letterPage.querySelector('.texto-carta');
        letterMessage.textContent = LETTER.message;
        letterMessage.style.whiteSpace = 'pre-line';
        const letterSignature = letterPage.querySelector('.firma');
        letterSignature.textContent = LETTER.signature;
        letterSignature.style.whiteSpace = 'pre-line';
        html = '<!doctype html>' + letterPage.documentElement.outerHTML;
      }
      frame.srcdoc = html;
      window.scrollTo(0, 0);
    };
    document.getElementById('login').addEventListener('submit', event => {
      event.preventDefault();
      if (document.getElementById('user').value === ACCESS.username && document.getElementById('pass').value === ACCESS.password) {
        document.getElementById('access').classList.add('hidden'); frame.classList.remove('hidden'); loadPage('inicio');
      } else { document.getElementById('error').textContent = 'Usuario o contraseña incorrectos.'; document.getElementById('pass').value = ''; }
    });
    window.addEventListener('message', event => { if (event.data && event.data.type === 'anniversary-navigation') loadPage(event.data.page); });
