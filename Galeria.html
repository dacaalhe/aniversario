<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nuestros recuerdos ❤️</title>

  <style>

    /* =========================================
       CONFIGURACIÓN GENERAL
    ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;

      background:
        linear-gradient(
          180deg,
          #fff0f5,
          #ffe1eb
        );

      color: #5a2638;

      min-height: 100vh;

      overflow-x: hidden;
    }


    /* =========================================
       CABECERA
    ========================================= */

    header {

      text-align: center;

      padding: 70px 20px 45px;
    }


    .corazon-principal {

      font-size: 65px;

      display: inline-block;

      animation: latir 1.5s infinite;

      margin-bottom: 15px;
    }


    header h1 {

      color: #d93668;

      font-size: 3rem;

      margin-bottom: 15px;
    }


    header p {

      max-width: 700px;

      margin: auto;

      font-size: 1.1rem;

      line-height: 1.7;

      color: #704052;
    }


    /* =========================================
       GALERÍA
    ========================================= */

    .galeria {

      max-width: 1100px;

      margin: 0 auto;

      padding: 20px;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 25px;
    }


    /* =========================================
       TARJETAS DE FOTOS
    ========================================= */

    .foto {

      position: relative;

      background: white;

      padding: 10px;

      border-radius: 20px;

      box-shadow:
        0 8px 25px
        rgba(180, 60, 100, 0.15);

      cursor: pointer;

      overflow: hidden;

      transition: 0.35s;
    }


    .foto:hover {

      transform:
        translateY(-8px)
        rotate(-1deg);

      box-shadow:
        0 15px 35px
        rgba(180, 60, 100, 0.25);
    }


    .foto img {

      width: 100%;

      height: 300px;

      object-fit: cover;

      border-radius: 15px;

      display: block;
    }


    /* =========================================
       TEXTO DEBAJO DE LA FOTO
    ========================================= */

    .descripcion {

      text-align: center;

      padding: 15px 10px 10px;

      color: #704052;

      font-size: 0.95rem;

      line-height: 1.5;
    }


    .descripcion strong {

      display: block;

      color: #d93668;

      font-size: 1.1rem;

      margin-bottom: 5px;
    }


    /* =========================================
       VENTANA DE FOTO GRANDE
    ========================================= */

    .modal {

      position: fixed;

      inset: 0;

      background:
        rgba(40, 10, 20, 0.85);

      display: none;

      justify-content: center;

      align-items: center;

      z-index: 1000;

      padding: 20px;
    }


    .modal.activo {

      display: flex;

      animation: aparecer 0.3s ease;
    }


    .modal img {

      max-width: 90%;

      max-height: 85vh;

      border-radius: 20px;

      box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.4);

      animation:
        zoom 0.3s ease;
    }


    /* =========================================
       BOTÓN CERRAR
    ========================================= */

    .cerrar {

      position: absolute;

      top: 25px;

      right: 30px;

      width: 45px;

      height: 45px;

      border-radius: 50%;

      border: none;

      background: white;

      color: #d93668;

      font-size: 25px;

      cursor: pointer;

      transition: 0.3s;
    }


    .cerrar:hover {

      transform: scale(1.1);

      background: #fff0f5;
    }


    /* =========================================
       BOTÓN VOLVER
    ========================================= */

    .volver {

      display: block;

      width: fit-content;

      margin: 60px auto 70px;

      padding: 15px 32px;

      background: white;

      color: #d93668;

      text-decoration: none;

      border-radius: 50px;

      font-weight: bold;

      border: 1px solid #ffd1df;

      box-shadow:
        0 5px 20px
        rgba(180, 60, 100, 0.12);

      transition: 0.3s;
    }


    .volver:hover {

      transform: scale(1.05);

      background: #fff5f8;
    }


    /* =========================================
       ANIMACIONES
    ========================================= */

    @keyframes latir {

      0%, 100% {

        transform: scale(1);
      }

      50% {

        transform: scale(1.15);
      }

    }


    @keyframes aparecer {

      from {

        opacity: 0;
      }

      to {

        opacity: 1;
      }

    }


    @keyframes zoom {

      from {

        transform: scale(0.8);

        opacity: 0;
      }

      to {

        transform: scale(1);

        opacity: 1;
      }

    }


    /* =========================================
       MÓVIL
    ========================================= */

    @media (max-width: 800px) {

      .galeria {

        grid-template-columns:
          repeat(2, 1fr);
      }

    }


    @media (max-width: 550px) {

      header {

        padding-top: 50px;
      }


      header h1 {

        font-size: 2.3rem;
      }


      .galeria {

        grid-template-columns: 1fr;

        padding: 15px;
      }


      .foto img {

        height: 280px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================================
       CABECERA
  ========================================= -->

  <header>

    <div class="corazon-principal">
      ❤️
    </div>


    <h1>
      Nuestros recuerdos
    </h1>


    <p>

      Cada foto guarda un momento,
      una sonrisa y un recuerdo que
      quiero conservar para siempre.

      ❤️

    </p>

  </header>



  <!-- =========================================
       GALERÍA
  ========================================= -->

  <main class="galeria">


    <!-- FOTO 1 -->

    <div
      class="foto"
      onclick="abrirFoto('imagenes/foto1.jpg')"
    >

      <img
        src="imagenes/foto1.jpg"
        alt="Nuestro recuerdo"
      >

      <div class="descripcion">

        <strong>
          ❤️ Nuestro primer recuerdo
        </strong>

      </div>

    </div>



    <!-- FOTO 2 -->

    <div
      class="foto"
      onclick="abrirFoto('imagenes/foto2.jpg')"
    >

      <img
        src="imagenes/foto2.jpg"
        alt="Nuestro recuerdo"
      >

      <div class="descripcion">

        <strong>
          🥰 Un momento juntos
        </strong>

      </div>

    </div>



    <!-- FOTO 3 -->

    <div
      class="foto"
      onclick="abrirFoto('imagenes/foto3.jpg')"
    >

      <img
        src="imagenes/foto3.jpg"
        alt="Nuestro recuerdo"
      >

      <div class="descripcion">

        <strong>
          💕 Un día especial
        </strong>

      </div>

    </div>



    <!-- FOTO 4 -->

    <div
      class="foto"
      onclick="abrirFoto('imagenes/foto4.jpg')"
    >

      <img
        src="imagenes/foto4.jpg"
        alt="Nuestro recuerdo"
      >

      <div class="descripcion">

        <strong>
          📸 Juntos
        </strong>

      </div>

    </div>



    <!-- FOTO 5 -->

    <div
      class="foto"
      onclick="abrirFoto('imagenes/foto5.jpg')"
    >

      <img
        src="imagenes/foto5.jpg"
        alt="Nuestro recuerdo"
      >

      <div class="descripcion">

        <strong>
          💗 Otro recuerdo
        </strong>

      </div>

    </div>



    <!-- FOTO 6 -->

    <div
      class="foto"
      onclick="abrirFoto('imagenes/foto6.jpg')"
    >

      <img
        src="imagenes/foto6.jpg"
        alt="Nuestro recuerdo"
      >

      <div class="descripcion">

        <strong>
          ❤️ Para siempre
        </strong>

      </div>

    </div>


  </main>



  <!-- =========================================
       VENTANA PARA VER LA FOTO GRANDE
  ========================================= -->

  <div
    class="modal"
    id="modal"
    onclick="cerrarFoto()"
  >

    <button
      class="cerrar"
      onclick="cerrarFoto()"
    >
      ×
    </button>


    <img
      id="fotoGrande"
      src=""
      alt="Foto ampliada"
    >

  </div>



  <!-- =========================================
       VOLVER
  ========================================= -->

  <a
    href="historia.html"
    class="volver"
  >

    ← Volver a nuestra historia

  </a>



  <!-- =========================================
       JAVASCRIPT
  ========================================= -->

  <script>

    function abrirFoto(ruta) {

      const modal =
        document.getElementById("modal");

      const foto =
        document.getElementById("fotoGrande");

      foto.src = ruta;

      modal.classList.add("activo");
    }


    function cerrarFoto() {

      const modal =
        document.getElementById("modal");

      modal.classList.remove("activo");
    }


    /* Evitar que al pulsar la foto
       se cierre la ventana */

    document
      .getElementById("fotoGrande")
      .addEventListener(
        "click",
        function(event) {

          event.stopPropagation();

        }
      );

  </script>


</body>
</html>
